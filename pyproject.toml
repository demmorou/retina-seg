[project]
name = "retina-seg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "demmorou", email = "sousadeusimar2@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "fastapi>=0.141.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "onnx>=1.23.0",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=5.0.0.93",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.2",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
retina-seg = "retina_seg:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
